<!DOCTYPE html>
<html lang="en">
  <head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CookCraft • Discover Delicious Recipes</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👩‍🍳</text></svg>">

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
  
  <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="app-header">
      <h1><i class="fas fa-utensils"></i> CookCraft</h1>
      <p>Discover delicious recipes by name, ingredient, cuisine, and more</p>
      </header>

      <p class="api-link">
        Powered by <a href="https://www.themealdb.com/api.php" target="_blank">TheMealDB 🧑‍🍳</a>
      </p>

      <div class="tabs">
        <button class="tab-btn active" data-tab="search">Search by Name</button>
        <button class="tab-btn" data-tab="letter">By First Letter</button>
        <button class="tab-btn" data-tab="category">By Category</button>
        <button class="tab-btn" data-tab="area">By Area</button>
        <button class="tab-btn" data-tab="ingredient">By Ingredient</button>
      </div>

      <div id="search-forms">

        <div class="search-form active" data-form="search">
          <input type="text" id="search-input" placeholder="e.g. Chicken Tikka, Pizza..." autocomplete="off" />
          <button id="search-btn"><i class="fas fa-search"></i></button>
        </div>

        <div class="search-form" data-form="letter">
          <input type="text" id="letter-input" maxlength="1" placeholder="A–Z" autocomplete="off" />
          <button id="letter-btn"><i class="fas fa-font"></i></button>
        </div>

        <div class="search-form" data-form="category">
          <select id="category-select">
            <option value="">Select a category</option>
            
          </select>
          <button id="category-btn">Go</button>
        </div>

        <div class="search-form" data-form="area">
          <select id="area-select">
            <option value="">Select a cuisine</option>
            
          </select>
          <button id="area-btn">Go</button>
        </div>

        <div class="search-form" data-form="ingredient">
          <input type="text" id="ingredient-input" placeholder="e.g. Chicken, Rice..." autocomplete="off" />
          <button id="ingredient-btn"><i class="fas fa-carrot"></i></button>
        </div>
      </div>

      <div id="loading" class="hidden">
        <div class="spinner"></div>
        <p>Fetching meals...</p>
      </div>

      <div id="error-container" class="hidden">
        <i class="fas fa-exclamation-circle"></i>
        <p id="error-message">No meals found.</p>
      </div>

      <div id="result-heading"></div>

      <div id="meals" class="meals-container"></div>
      <div id="meal-details" class="hidden">
        <button id="back-btn"><i class="fas fa-arrow-left"></i> Back</button>
        <div class="meal-details-content"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
